<!DOCTYPE html>
<html>
<head>
    <title>GPS Test</title>
</head>
<body>
    <h1>GPS Test Page</h1>
    <div id="location">Testing...</div>
    <button onclick="testGPS()">Test GPS</button>
    
    <script>
        async function testGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('location').innerHTML = 
                            `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
                    },
                    (error) => {
                        document.getElementById('location').innerHTML = `Error: ${error.message}`;
                    }
                );
            } else {
                document.getElementById('location').innerHTML = 'GPS not supported';
            }
        }
    </script>
</body>
</html>
