spring.application.name=moviehub-backend

# Datasource configuration with H2 in-memory fallback for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:moviehubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

