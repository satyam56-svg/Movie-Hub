spring.application.name=moviehub-backend

# -----------------------------------------------
# Datasource — falls back to H2 in-memory if no
# SPRING_DATASOURCE_URL env var is provided.
# On Render/Production: set SPRING_DATASOURCE_URL
# to your PostgreSQL connection string.
# -----------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:moviehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# -----------------------------------------------
# H2 Console (dev only — disable in production)
# -----------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# -----------------------------------------------
# JWT Secret
# -----------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}